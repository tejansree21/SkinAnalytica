# SkinAnalytica — Master Config
# C:\Users\tejan\OneDrive\Desktop\drive\SkinAnalytica\configs\skin_config.yaml

project:
  name: SkinAnalytica
  version: "1.0.0"
  description: "ISIC-grade dermoscopy AI platform"
  base_path: "C:\\Users\\tejan\\OneDrive\\Desktop\\drive\\SkinAnalytica"

datasets:
  ham10000:
    path: "datasets\\ham10000"
    images_part1: "datasets\\ham10000\\images_part1"
    images_part2: "datasets\\ham10000\\images_part2"
    metadata_csv: "datasets\\ham10000\\metadata\\HAM10000_metadata.csv"
    n_classes: 7
    split_by: "lesion_id"

  isic_2019:
    path: "datasets\\isic_2019"
    images: "datasets\\isic_2019\\images"
    labels_csv: "datasets\\isic_2019\\metadata\\ISIC_2019_Training_GroundTruth.csv"
    n_classes: 8

  isic_2020:
    path: "datasets\\isic_2020"
    images: "datasets\\isic_2020\\images"
    labels_csv: "datasets\\isic_2020\\metadata\\train.csv"
    n_classes: 2
    target_col: "target"

  ph2:
    path: "datasets\\ph2"
    images: "datasets\\ph2\\images"
    use: "validation_only"

classes:
  ham10000:
    - akiec
    - bcc
    - bkl
    - df
    - mel
    - nv
    - vasc
  isic_2019:
    - AK
    - BCC
    - BKL
    - DF
    - MEL
    - NV
    - SCC
    - VASC
  unified:
    0: mel
    1: nv
    2: bcc
    3: akiec
    4: bkl
    5: df
    6: vasc

class_imbalance:
  ham10000_ratio: 58
  isic_2020_ratio: 56
  strategy: "weighted_sampler + enhanced_focal_loss"

training:
  device: "cuda"
  precision: "fp16"
  seed: 42
  num_workers: 0
  img_size: 224
  val_fraction: 0.15

  efficientnetv2:
    model_name: "tf_efficientnetv2_l"
    pretrained: true
    batch_size: 16
    epochs: 50
    lr_backbone: 5.0e-6
    lr_head: 1.0e-4
    weight_decay: 1.0e-5
    scheduler: "cosine"
    early_stopping_patience: 8

  vit:
    model_name: "vit_large_patch16_224"
    pretrained: true
    batch_size: 8
    epochs: 50
    lr_backbone: 2.0e-6
    lr_head: 5.0e-5
    weight_decay: 1.0e-5
    scheduler: "cosine"
    early_stopping_patience: 8

  convnext:
    model_name: "convnext_large"
    pretrained: true
    batch_size: 16
    epochs: 50
    lr_backbone: 5.0e-6
    lr_head: 1.0e-4
    weight_decay: 1.0e-5
    scheduler: "cosine"
    early_stopping_patience: 8

  ensemble:
    strategy: "learned_weighted_average"
    calibration: "temperature_scaling"

augmentation:
  train:
    img_size: 224
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_limit: 30
    hue_shift: 10
    sat_shift: 20
    val_shift: 10
    coarse_dropout_holes: [4, 8]
    coarse_dropout_size: [10, 20]
    mixup_alpha: 0.4
    cutmix_alpha: 1.0
    randaugment_n: 2
    randaugment_m: 9
    clahe_clip: 2.0
    clahe_prob: 0.3
    gaussian_blur_prob: 0.2
    hair_removal: true
  val:
    img_size: 224
    hair_removal: true

loss:
  type: "enhanced_focal_loss"
  gamma: 2.0
  alpha: 0.75
  label_smoothing: 0.1

metrics:
  primary: "mel_auc"
  secondary:
    - "accuracy"
    - "f1_macro"
    - "sensitivity_mel"
    - "specificity_mel"
    - "false_negative_rate_mel"

explainability:
  gradcam_plus_plus: true
  shap: true
  tixai: true
  mc_dropout_runs: 20

inference:
  # This section is REFERENCE DOCUMENTATION, not a loaded config file — the
  # authoritative values live in api/SA05_api.py as Python constants.
  # tests/test_config_consistency.py fails loudly if these two ever
  # diverge again (see docs/KNOWN_GAPS.md: the original bug this session
  # started with was exactly this file saying 0.45 while the deployed code
  # used 0.312). Loading this YAML at runtime was considered and rejected —
  # it would mean adding pyyaml as a new production dependency to an
  # already-deployed service for a problem a sync-check test solves with
  # zero deployment risk.
  #
  # mel threshold must match
  # models/production/ensemble/ensemble_metrics_selfconsistent.json
  # ("threshold") and api/SA05_api.py MEL_THRESHOLD. Corrected 0.312 -> 0.2385
  # earlier this session (geometric- vs arithmetic-pooling calibration
  # mismatch), then 0.2385 -> 0.5010 on 2026-07-28 (finding #26) when
  # config/val.csv was adopted as the new documented validation manifest
  # under the center-crop preprocessing change — see the MEL_THRESHOLD
  # comment in api/SA05_api.py and docs/MODEL_CARD.md finding #26 for the
  # full story.
  thresholds:
    mel: 0.5010
    bcc: 0.50
    akiec: 0.50
    default: 0.50
  confidence_floor: 0.70

  # Age-conditional melanoma thresholds (api/SA05_api.py AGE_BAND_THRESHOLDS)
  # — derived from outputs/bias_reports/threshold_ci_age_analysis.json to
  # close the age-based sensitivity gap (27-82% at a flat threshold).
  # Re-derived 2026-07-28 under center-crop preprocessing (finding #25) —
  # see the comment above AGE_BAND_THRESHOLDS in api/SA05_api.py.
  age_conditional_mel_thresholds:
    "0-30": 0.1492
    "30-45": 0.0728
    "45-60": 0.1266
    "60-75": 0.2153
    "75+": 0.1787

  # Review-band floor as a fraction of whichever mel threshold applies
  # (api/SA05_api.py MEL_REVIEW_BAND_FACTOR) — scores in
  # [threshold * factor, threshold) route to REVIEW_REQUIRED instead of
  # NORMAL, catching borderline cases before image-quality instability can
  # flip them silently.
  review_band_factor: 0.5

  # Capture-modality-conditional threshold (api/SA05_api.py
  # TBP_MEL_THRESHOLD) — Path A from docs/MODEL_CARD.md finding #12.
  # Dermatoscope-tuned thresholds (mel / age-conditional above) don't
  # transfer to 3D-total-body-photography-style crops; this is the
  # separately-derived threshold for 80% sensitivity on that population
  # (143-malignant-case external holdout, AUC 0.6131). Selected via the
  # /analyze `capture_mode="tbp"` parameter — never auto-detected.
  # Confirmed UNCHANGED under 2026-07-28 center-crop preprocessing (finding
  # #25) — SLICE-3D crops are already square, so the crop is a no-op here.
  tbp_mel_threshold: 0.0199

  # Skin-tone-conditional thresholds (api/SA05_api.py SKIN_TONE_THRESHOLDS)
  # — from docs/MODEL_CARD.md finding #14 (MILK10k dermoscopy holdout).
  # PROVISIONAL, far less statistically solid than age_conditional above:
  # derived from only 13/28/18 melanoma cases per band (vs 585 for age),
  # and finding #14 could not confirm the underlying sensitivity gap is
  # real rather than sampling noise. Tones 0/1/5 excluded (too few
  # melanoma cases to derive anything at all). Selected via the /analyze
  # `skin_tone_class` parameter (0-5, MILK10k scale) — never
  # auto-detected, and nothing in the current product wires this up yet.
  # Re-derived 2026-07-28 under center-crop preprocessing (finding #25) —
  # see the comment above SKIN_TONE_THRESHOLDS in api/SA05_api.py.
  skin_tone_mel_thresholds:
    "2": 0.0536
    "3": 0.0627
    "4": 0.0162

research_module:
  bulk_batch_size: 64
  high_confidence_threshold: 0.90
  medium_confidence_threshold: 0.70
  disagreement_threshold: 0.85
  demographic_fields:
    - age
    - sex
    - localization
    - dx_type
  bias_significance_threshold: 0.05

onnx:
  opset_version: 17
  quantization: "int8"
  providers:
    - "CUDAExecutionProvider"
    - "CPUExecutionProvider"
